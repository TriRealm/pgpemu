<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PGP Emulator - Secrets Uploader</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 20px;
    background: #111;
    color: #eee;
    font-family: Arial, sans-serif;
  }
  .container { max-width: 560px; margin: 40px auto; }
  h1 { font-size: 28px; margin-bottom: 5px; }
  .subtitle { color: #888; margin-bottom: 30px; }
  .card {
    background: #1d1d1d;
    border-radius: 12px;
    padding: 24px;
    margin-bottom: 20px;
  }
  .card h2 { margin-top: 0; font-size: 18px; }
  label { display: block; margin-top: 14px; margin-bottom: 6px; font-size: 14px; color: #ccc; }
  input, select, textarea {
    width: 100%;
    padding: 10px;
    border-radius: 8px;
    border: 1px solid #444;
    background: #111;
    color: #fff;
    font-size: 14px;
    font-family: monospace;
  }
  textarea { min-height: 70px; resize: vertical; }
  button {
    width: 100%;
    padding: 14px;
    margin-top: 20px;
    font-size: 16px;
    font-weight: bold;
    border: 0;
    border-radius: 8px;
    background: #2ecc71;
    color: #111;
    cursor: pointer;
  }
  button:disabled { background: #555; color: #999; cursor: not-allowed; }
  button.secondary { background: #333; color: #fff; }
  #log {
    background: #000;
    color: #0f0;
    font-family: monospace;
    font-size: 13px;
    padding: 12px;
    border-radius: 8px;
    min-height: 120px;
    max-height: 300px;
    overflow-y: auto;
    white-space: pre-wrap;
    margin-top: 15px;
  }
  .browser-note {
    background: #2a2200;
    border: 1px solid #665500;
    color: #ffd966;
    border-radius: 8px;
    padding: 12px 16px;
    margin-bottom: 20px;
    font-size: 14px;
  }
  .hint { font-size: 12px; color: #888; margin-top: 4px; }
  a { color: #6fb1ff; }
  .nav { margin-top: 30px; text-align: center; }
</style>
</head>
<body>

<div class="container">

  <h1>Upload PGP Secrets</h1>
  <div class="subtitle">Send your device's MAC, key, and blob directly over USB</div>

  <div class="browser-note">
    Requires <strong>Chrome, Edge, or Opera on desktop</strong>. Your device must already be flashed and running.
  </div>

  <div class="card">
    <h2>1. Connect</h2>
    <button id="connectBtn">Connect to Device</button>
    <div class="hint" id="connectionStatus">Not connected</div>
  </div>

  <div class="card">
    <h2>2. Device Secrets</h2>

    <label for="slot">Secrets slot (0-9)</label>
    <select id="slot">
      <option>0</option><option>1</option><option>2</option><option>3</option><option>4</option>
      <option>5</option><option>6</option><option>7</option><option>8</option><option>9</option>
    </select>

    <label for="name">Device name (max 15 characters)</label>
    <input id="name" type="text" maxlength="15" placeholder="BluePGP">

    <label for="mac">MAC address (colon or dash separated hex, 6 bytes)</label>
    <input id="mac" type="text" placeholder="98:B6:E9:12:39:D2">
    <div class="hint" id="macHint"></div>

    <label for="key">Device key (hex, 16 bytes / 32 characters)</label>
    <input id="key" type="text" placeholder="d14a173d...">
    <div class="hint" id="keyHint"></div>

    <label for="blob">Blob (hex, 256 bytes / 512 characters)</label>
    <textarea id="blob" placeholder="80d266dd45c870..."></textarea>
    <div class="hint" id="blobHint"></div>

    <button id="uploadBtn" disabled>Upload Secrets</button>
  </div>

  <div class="card">
    <h2>Log</h2>
    <div id="log">Waiting to connect...</div>
    <button class="secondary" id="clearLogBtn" style="margin-top:10px;">Clear Log</button>
  </div>

  <div class="nav">
    <a href="index.html">&larr; Back to flasher</a>
  </div>

</div>

<script>


// STATE


let port = null;
let reader = null;
let writer = null;
let readLoopPromise = null;
let lineBuffer = "";
let pendingLineResolvers = [];


// LOGGING


function log(msg) {
    const el = document.getElementById('log');
    el.textContent += msg + "\n";
    el.scrollTop = el.scrollHeight;
}

document.getElementById('clearLogBtn').addEventListener('click', () => {
    document.getElementById('log').textContent = '';
});


// HEX / VALIDATION HELPERS


function hexToBytes(hexStr) {
    const clean = hexStr.trim().replace(/[:\-\s]/g, '');
    if (clean.length % 2 !== 0) {
        throw new Error("odd number of hex characters");
    }
    const bytes = new Uint8Array(clean.length / 2);
    for (let i = 0; i < clean.length; i += 2) {
        const byte = parseInt(clean.substr(i, 2), 16);
        if (isNaN(byte)) {
            throw new Error("invalid hex characters");
        }
        bytes[i / 2] = byte;
    }
    return bytes;
}

function bytesToBase64(bytes) {
    let binary = '';
    for (let i = 0; i < bytes.length; i++) {
        binary += String.fromCharCode(bytes[i]);
    }
    return btoa(binary);
}

// Standard CRC32 (matches Python's binascii.crc32)
const CRC32_TABLE = (() => {
    const table = [];
    for (let n = 0; n < 256; n++) {
        let c = n;
        for (let k = 0; k < 8; k++) {
            c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1);
        }
        table[n] = c >>> 0;
    }
    return table;
})();

function crc32(bytes) {
    let crc = 0xFFFFFFFF;
    for (let i = 0; i < bytes.length; i++) {
        crc = CRC32_TABLE[(crc ^ bytes[i]) & 0xFF] ^ (crc >>> 8);
    }
    return (crc ^ 0xFFFFFFFF) >>> 0;
}

function crc32Hex(bytes) {
    return crc32(bytes).toString(16).padStart(8, '0');
}

function updateHint(elId, bytes, expectedLen) {
    const el = document.getElementById(elId);
    const ok = bytes.length === expectedLen;
    el.textContent = `${bytes.length} bytes (need ${expectedLen})`;
    el.style.color = ok ? '#6f6' : '#f66';
    return ok;
}

['mac', 'key', 'blob'].forEach((id) => {
    const expectedLens = { mac: 6, key: 16, blob: 256 };
    document.getElementById(id).addEventListener('input', () => {
        try {
            const bytes = hexToBytes(document.getElementById(id).value);
            updateHint(id + 'Hint', bytes, expectedLens[id]);
        } catch (e) {
            document.getElementById(id + 'Hint').textContent = 'invalid hex';
            document.getElementById(id + 'Hint').style.color = '#f66';
        }
    });
});

// ============================================================
// SERIAL CONNECTION
// ============================================================

async function connect() {
    if (!('serial' in navigator)) {
        log("ERROR: Web Serial not supported. Use Chrome, Edge, or Opera on desktop.");
        return;
    }

    try {
        port = await navigator.serial.requestPort();
        await port.open({ baudRate: 115200 });

        // Explicitly avoid asserting DTR/RTS so we don't
        // accidentally trigger bootloader/reset behavior on
        // boards that wire those lines to EN/GPIO0.
        try {
            await port.setSignals({ dataTerminalReady: false, requestToSend: false });
        } catch (e) {
            // Not all platforms support setSignals; harmless if it fails.
        }

        startReadLoop();

        document.getElementById('connectionStatus').textContent = 'Connected';
        document.getElementById('connectBtn').textContent = 'Disconnect';
        document.getElementById('uploadBtn').disabled = false;

        log("Connected to device.");
    } catch (e) {
        log("Connection failed: " + e.message);
    }
}

async function disconnect() {
    try {
        if (reader) {
            await reader.cancel();
        }
        if (readLoopPromise) {
            await readLoopPromise;
        }
        if (port) {
            await port.close();
        }
    } catch (e) {
        // ignore
    }

    port = null;
    reader = null;
    writer = null;

    document.getElementById('connectionStatus').textContent = 'Not connected';
    document.getElementById('connectBtn').textContent = 'Connect to Device';
    document.getElementById('uploadBtn').disabled = true;

    log("Disconnected.");
}

document.getElementById('connectBtn').addEventListener('click', () => {
    if (port) {
        disconnect();
    } else {
        connect();
    }
});


// READ LOOP (line-buffered)


function startReadLoop() {
    const textDecoder = new TextDecoderStream();
    port.readable.pipeTo(textDecoder.writable);
    reader = textDecoder.readable.getReader();

    readLoopPromise = (async () => {
        try {
            while (true) {
                const { value, done } = await reader.read();
                if (done) break;
                if (value) {
                    lineBuffer += value;
                    let idx;
                    while ((idx = lineBuffer.indexOf('\n')) >= 0) {
                        const line = lineBuffer.slice(0, idx).replace(/\r$/, '');
                        lineBuffer = lineBuffer.slice(idx + 1);
                        deliverLine(line);
                    }
                }
            }
        } catch (e) {
            // reader cancelled/closed, expected on disconnect
        }
    })();
}

function deliverLine(line) {
    log("< " + line);
    if (pendingLineResolvers.length > 0) {
        const resolve = pendingLineResolvers.shift();
        resolve(line);
    }
}

function readLine(timeoutMs = 5000) {
    return new Promise((resolve, reject) => {
        const timer = setTimeout(() => {
            const idx = pendingLineResolvers.indexOf(wrappedResolve);
            if (idx >= 0) pendingLineResolvers.splice(idx, 1);
            reject(new Error("timeout waiting for device response"));
        }, timeoutMs);

        function wrappedResolve(line) {
            clearTimeout(timer);
            resolve(line);
        }

        pendingLineResolvers.push(wrappedResolve);
    });
}

async function writeText(text) {
    const encoder = new TextEncoder();
    const w = port.writable.getWriter();
    try {
        await w.write(encoder.encode(text));
    } finally {
        w.releaseLock();
    }
    log("> " + text.replace(/\n/g, '\\n'));
}


// PROTOCOL: single-value command (N/M/K/B), mirrors
// serial_command() in secrets_upload.py


async function sendFieldCommand(command, value, isText) {
    await writeText(command);

    let line = await readLine();
    if (!line.includes(`set=${command}`)) {
        throw new Error(`device did not acknowledge '${command}' command (got: ${line})`);
    }

    let payload;
    if (isText) {
        payload = value;
    } else {
        payload = bytesToBase64(value);
    }

    await writeText(payload + "\n");

    line = await readLine();
    if (!line.includes(`${command}=[OK]`)) {
        throw new Error(`device rejected '${command}' data (got: ${line})`);
    }
}


// MAIN UPLOAD SEQUENCE


async function uploadSecrets() {
    const uploadBtn = document.getElementById('uploadBtn');
    uploadBtn.disabled = true;

    try {
        const slot = document.getElementById('slot').value;
        const name = document.getElementById('name').value.trim();

        if (!name || name.length > 15) {
            throw new Error("device name must be 1-15 characters");
        }

        const macBytes = hexToBytes(document.getElementById('mac').value);
        const keyBytes = hexToBytes(document.getElementById('key').value);
        const blobBytes = hexToBytes(document.getElementById('blob').value);

        if (macBytes.length !== 6) throw new Error(`MAC must be 6 bytes, got ${macBytes.length}`);
        if (keyBytes.length !== 16) throw new Error(`Device key must be 16 bytes, got ${keyBytes.length}`);
        if (blobBytes.length !== 256) throw new Error(`Blob must be 256 bytes, got ${blobBytes.length}`);

        log("=== Starting upload ===");

        // Enter secrets mode
        log("Entering secrets mode...");
        await writeText("X");
        let line;
        do {
            line = await readLine(10000);
        } while (line !== "!");

        // Select slot
        log(`Selecting slot ${slot}...`);
        await writeText(slot);
        line = await readLine();
        if (!line.includes(`slot=${slot}`)) {
            throw new Error(`failed selecting slot: ${line}`);
        }

        // Send name, mac, key, blob
        log("Sending name...");
        await sendFieldCommand('N', name, true);

        log("Sending MAC...");
        await sendFieldCommand('M', macBytes, false);

        log("Sending device key...");
        await sendFieldCommand('K', keyBytes, false);

        log("Sending blob...");
        await sendFieldCommand('B', blobBytes, false);

        // Verify CRC of scratch buffer
        const combined = new Uint8Array(macBytes.length + keyBytes.length + blobBytes.length);
        combined.set(macBytes, 0);
        combined.set(keyBytes, macBytes.length);
        combined.set(blobBytes, macBytes.length + keyBytes.length);
        const wantedCrc = crc32Hex(combined);

        log("Checking scratch buffer CRC...");
        await writeText("s");
        line = await readLine();
        if (!line.includes(`slot=tmp crc=${wantedCrc}`)) {
            throw new Error(`CRC mismatch in scratch buffer! wanted ${wantedCrc}, device said: ${line}`);
        }

        // Write to NVS
        log("Writing to NVS...");
        await writeText("W");
        line = await readLine();
        if (!line.includes('[OK]')) {
            throw new Error(`write failed: ${line}`);
        }
        line = await readLine();
        if (!line.includes('write=1')) {
            throw new Error(`write result bad: ${line}`);
        }

        // Read back and verify
        log("Verifying readback...");
        await writeText("S");
        line = await readLine();
        if (!line.includes(`slot=${slot} crc=${wantedCrc}`)) {
            throw new Error(`readback CRC mismatch! wanted ${wantedCrc}, device said: ${line}`);
        }

        log("Readback OK - secrets confirmed on device.");

        // Leave secrets mode
        log("Leaving secrets mode...");
        await writeText("q");
        do {
            line = await readLine(5000);
        } while (line !== "X");

        log("=== Upload complete! ===");
        log(`Slot ${slot} ("${name}") is ready. Use the UART menu (X${slot}!) or wire up a button to select it as the active device.`);

    } catch (e) {
        log("ERROR: " + e.message);
        log("Upload failed. You can try again once the device settles - it may need a moment before accepting new commands.");
    } finally {
        uploadBtn.disabled = false;
    }
}

document.getElementById('uploadBtn').addEventListener('click', uploadSecrets);

</script>

</body>
</html>
